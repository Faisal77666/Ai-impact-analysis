name: Impact Analysis Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  impact-check:
    name: impact-check
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\" --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      pull-requests: write
    env:
      PORT: 5000
      OPENMETADATA_BASE_URL: ${{ secrets.OPENMETADATA_BASE_URL }}
      OPENMETADATA_TOKEN: ${{ secrets.OPENMETADATA_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MONGO_URI: mongodb://127.0.0.1:27017/impact_analysis
      LLM_PROVIDER: groq
      GROQ_MODEL: llama-3.3-70b-versatile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Detect changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(sql|json|yaml|yml)$' || true)

          {
            echo "changed_files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$CHANGED_FILES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize analysis artifact
        run: |
          echo '{"status":"skipped","reason":"No relevant changed files detected."}' > analysis-result.json

      - name: Start backend server
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          cd backend
          npm run start > ../backend-server.log 2>&1 &

      - name: Wait for backend health
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to become healthy"
          cat backend-server.log || true
          exit 1

      - name: Run impact analysis for changed files
        id: analyze
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          CHANGED_FILES_RAW="${{ steps.changed.outputs.changed_files }}"
          CHANGED_COUNT=$(echo "$CHANGED_FILES_RAW" | sed '/^$/d' | wc -l | tr -d ' ')
          CHANGED_PREVIEW=$(echo "$CHANGED_FILES_RAW" | sed '/^$/d' | head -n 25 | tr '\n' '; ' | sed 's/; $//')

          QUERY="PR impact assessment context: ${CHANGED_COUNT} changed config/schema files. Files preview: ${CHANGED_PREVIEW}. Analyze likely lineage, schema, and downstream risks."
          PAYLOAD=$(jq -n --arg query "$QUERY" '{query: $query}')

          ATTEMPTS=0
          MAX_ATTEMPTS=3
          until [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; do
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Analysis attempt $ATTEMPTS/$MAX_ATTEMPTS"
            if curl -sS --fail-with-body -X POST "http://localhost:5000/api/analyze" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" > analysis-result.json; then
              break
            fi
            if [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying impact analysis request..."
              sleep 2
            fi
          done

          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo '{"success":false,"message":"Impact analysis API failed after retries"}' > analysis-result.json
          fi

          RISK_LABEL=$(jq -r '.impactReport.riskLevel // .simulation.riskLevel // .riskLevel // .impactReport.risk.label // .impactReport.riskScore // .simulation.riskScore // .result.riskScore // "UNKNOWN"' analysis-result.json)
          RISK_UPPER=$(echo "$RISK_LABEL" | tr '[:lower:]' '[:upper:]')
          echo "risk_label=$RISK_LABEL" >> "$GITHUB_OUTPUT"

          if [ "$RISK_UPPER" = "CRITICAL" ]; then
            echo "critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "critical=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$RISK_UPPER" = "HIGH" ]; then
            echo "high=true" >> "$GITHUB_OUTPUT"
          else
            echo "high=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment full impact report on PR
        if: always()
        uses: actions/github-script@v7
        env:
          HAS_CHANGES: ${{ steps.changed.outputs.has_changes }}
          CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
          RISK_LABEL: ${{ steps.analyze.outputs.risk_label }}
        with:
          script: |
            const fs = require('fs');
            const hasChanges = process.env.HAS_CHANGES === 'true';
            const changedFiles = (process.env.CHANGED_FILES || '').split('\n').filter(Boolean);
            let reportContent = '{}';

            try {
              reportContent = fs.readFileSync('analysis-result.json', 'utf8');
            } catch (error) {
              reportContent = JSON.stringify({ status: 'error', message: 'analysis-result.json not found' }, null, 2);
            }

            const riskLabel = process.env.RISK_LABEL || 'N/A';
            const riskUpper = String(riskLabel).toUpperCase();
            const statusLine = !hasChanges
              ? 'No relevant changed files were detected, so analysis was skipped.'
              : riskUpper === 'CRITICAL'
                ? 'Critical risk detected. Merge should be blocked until mitigations are in place.'
                : riskUpper === 'HIGH'
                  ? 'High risk detected. Review mitigations before merge.'
                  : 'No critical/high risk detected based on current analysis output.';

            const body = [
              '## Impact Analysis Summary',
              '',
              `- Files analyzed: ${changedFiles.length}`,
              `- Risk level: ${riskLabel}`,
              `- Status: ${statusLine}`,
              '',
              changedFiles.length ? '### Changed Files' : null,
              changedFiles.length ? changedFiles.map((f) => `- ${f}`).join('\n') : null,
              '',
              '<details><summary>Raw Analysis Payload</summary>',
              '',
              '```json',
              reportContent,
              '```',
              '',
              '</details>'
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail workflow on Critical risk
        if: steps.analyze.outputs.critical == 'true'
        run: |
          echo "Critical risk detected. Failing workflow."
          exit 1

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-analysis-result
          path: analysis-result.json
